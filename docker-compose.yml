# docker compose up 단일 명령으로 전체 스택을 기동한다 (ADR-0025).
# 비밀번호와 API 키는 로컬 개발용 기본값이며, 운영 환경에서는 환경변수로 주입한다 (ADR-0030).
name: alarm

x-app: &app
  build: .
  image: alarm-dispatcher:local
  init: true
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    mock:
      condition: service_healthy

x-app-env: &app-env
  DATABASE_URL: postgres://alarm_app:alarm_app_pw@postgres:5432/alarm
  EXTERNAL_API_BASE_URL: http://mock:4000
  LOG_LEVEL: info
  MANAGEMENT_PORT: '9100'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres_pw
      ALARM_MIGRATOR_PASSWORD: alarm_migrator_pw
      ALARM_APP_PASSWORD: alarm_app_pw
    volumes:
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      # 초기화 중의 임시 서버는 TCP 소켓을 열지 않으므로, init 스크립트 완료 후 healthy가 되도록 TCP(127.0.0.1)로 확인한다.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d alarm']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mock:
    image: ghcr.io/us-all/backend-assignment-api:1.2
    # 이미지 내장 GET /health 헬스체크는 기동 순서 제어에만 사용한다 (ADR-0014).
    restart: unless-stopped

  migrate:
    build: .
    image: alarm-dispatcher:local
    command: ['node', 'dist/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgres://alarm_migrator:alarm_migrator_pw@postgres:5432/alarm
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *app
    command: ['node', 'dist/main-api.js']
    environment:
      <<: *app-env
      PORT: '3000'
      # 개발용 기본값이며 API_KEY 환경변수로 재정의할 수 있다 (ADR-0033).
      API_KEY: ${API_KEY:-dev-api-key}
    ports:
      # 로컬 루프백(127.0.0.1)에만 바인딩하여 외부 네트워크 노출을 차단한다.
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9100/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ['node', 'dist/main-worker.js']
    environment:
      <<: *app-env
    deploy:
      replicas: 2
    # 인플라이트 요청(최대 10초)을 정상 마무리하기 위한 종료 유예 시간 (ADR-0007).
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9100/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 6

  # docker compose --profile test run --rm test (ADR-0035)
  test:
    profiles: ['test']
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres_pw@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy

  # E2E 시나리오 실행 컨테이너 (scripts/e2e.sh에서 사용, ADR-0035).
  e2e:
    profiles: ['e2e']
    build:
      context: .
      target: test
    environment:
      API_BASE_URL: http://api:3000
      MOCK_BASE_URL: http://mock:4000
      API_KEY: ${API_KEY:-dev-api-key}

  # docker compose --profile monitoring up (ADR-0027)
  prometheus:
    profiles: ['monitoring']
    image: prom/prometheus:v3.5.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - api

volumes:
  pgdata:
