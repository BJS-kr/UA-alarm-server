# monitoring 프로필 전용 (ADR-0027). 관리 포트는 외부에 공개하지 않으므로 compose 네트워크 안에서 긁는다.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9100']

  # 워커는 여러 대이므로 서비스 이름의 A 레코드로 모든 인스턴스를 찾는다.
  - job_name: worker
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9100
